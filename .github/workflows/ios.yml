name: Build iPhone IPA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 编译并打包 IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project Stilltone-iOS-0.2.2-build14-cloud/FL-Camera.xcodeproj \
            -target FLCamera -configuration Release -sdk iphoneos \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/device" build
          mkdir -p Payload
          ditto "$RUNNER_TEMP/device/FLCamera.app" Payload/FLCamera.app
          zip -qry FLCamera-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FLCamera-unsigned
          path: FLCamera-unsigned.ipa
          if-no-files-found: error
